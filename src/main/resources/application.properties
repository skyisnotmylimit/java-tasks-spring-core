# Database connection settings
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1
db.username=sa
db.password=

# Hibernate settings
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.hbm2ddl.auto=validate

# SQL scripts executed on application start
db.schema.script=classpath:sql/schema.sql
db.data.script=classpath:sql/data.sql
